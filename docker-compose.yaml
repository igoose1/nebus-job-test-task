services:
  service:
    build: .
    command: python -m src.api
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_LISTEN_HOST=0.0.0.0
    ports:
      - 127.0.0.1:${SERVICE_LISTEN_PORT}:${SERVICE_LISTEN_PORT}
    healthcheck:
      test: ["CMD", "httpcheck", "http://127.0.0.1:${SERVICE_LISTEN_PORT}/api/v1/health"]
      interval: 10s
      timeout: 1s
      retries: 5
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: uv.lock

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      - POSTGRES_DB=service
      - POSTGRES_PASSWORD=changeme
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "service"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql


volumes:
  postgres-data:
